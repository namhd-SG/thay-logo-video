[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thay-logo-video"
version = "1.0.0"
description = "Thay logo/watermark (đứng yên hoặc trôi) trong video bằng logo của bạn"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # Bản có cửa sổ (không 'headless') để lệnh `thay-logo chon-box` mở được cửa sổ kéo khung.
  "opencv-python>=4.8",
  "numpy>=1.24",
  # Trang web chạy trên máy (thay-logo web)
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  # Tab "Dán link Drive" — tải file Drive công khai, không cần đăng nhập
  "gdown>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
thay-logo = "thay_logo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thay_logo = ["tai_nguyen/*.png", "web_tinh/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
